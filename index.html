<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Japan Quest 日本大冒險</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&family=Noto+Sans+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FBF6F2; --blush:#FCE8EE; --pink:#EFA3B8; --rose:#C93A6C; --rose-d:#A12855;
  --ink:#1E2340; --muted:#6B6F86; --line:#F1CFDA; --ok:#2E9E6B; --ok-bg:#E3F5EC; --bad:#D9483B; --bad-bg:#FDE7E4;
  --sky:#3D7BD9; --gold:#F2B33D;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--cream);color:var(--ink);font-family:"Nunito","Noto Sans TC",system-ui,sans-serif;font-size:17px;line-height:1.45;overflow-x:hidden}
.zh{font-family:"Noto Sans TC","Nunito",sans-serif}
h1,h2,h3,.f{font-family:"Fredoka","Noto Sans TC",sans-serif;font-weight:600;margin:0;letter-spacing:.2px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
#app{max-width:760px;margin:0 auto;padding:18px 16px 40px;min-height:100%;position:relative;z-index:1}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-weight:800;font-size:16px}
.chip .big{font-family:Fredoka;font-size:20px;color:var(--rose)}
.icon-btn{width:42px;height:42px;border-radius:50%;background:#fff;border:2px solid var(--line);display:grid;place-items:center;font-size:19px}
.eyebrow{font-size:13px;font-weight:800;color:var(--rose);text-transform:uppercase;letter-spacing:1px}
.card{background:#fff;border-radius:22px;border:2px solid var(--line);padding:20px;box-shadow:0 6px 0 var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--rose);color:#fff;font-family:Fredoka;font-weight:600;font-size:21px;padding:14px 28px;border-radius:16px;box-shadow:0 5px 0 var(--rose-d);transition:transform .08s, box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--rose-d)}
.btn.ghost{background:#fff;color:var(--rose);border:2px solid var(--line);box-shadow:0 5px 0 var(--line)}
.btn[disabled]{opacity:.45;pointer-events:none}
.center{text-align:center}
.muted{color:var(--muted)}
.fade-in{animation:fi .35s ease both}
@keyframes fi{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.shake{animation:shake .4s}

/* start */
.hero{position:relative;border-radius:26px;overflow:hidden;min-height:340px;display:flex;align-items:flex-end;color:#fff;box-shadow:0 8px 0 var(--line)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,20,60,0) 30%,rgba(20,20,60,.72))}
.hero .in{position:relative;z-index:1;padding:26px}
.hero h1{font-size:clamp(40px,8vw,62px);line-height:1;text-shadow:0 3px 14px rgba(0,0,0,.3)}
.hero p{margin:8px 0 0;font-size:18px;font-weight:700;opacity:.95}
.name-row{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.name-row input{flex:1;min-width:180px;font:inherit;font-size:20px;font-weight:700;padding:14px 16px;border-radius:16px;border:2px solid var(--line);background:#fff;color:var(--ink);outline:none}
.name-row input:focus{border-color:var(--pink)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:16px}
.rule{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-weight:700;font-size:15px}
.rule b{display:block;font-family:Fredoka;font-size:26px;margin-bottom:2px}

/* map */
.map{position:relative;margin-top:6px;display:flex;flex-direction:column;gap:14px}
.stop{display:flex;align-items:center;gap:16px;background:#fff;border:2px solid var(--line);border-radius:22px;padding:12px;text-align:left;width:100%;box-shadow:0 5px 0 var(--line);position:relative}
.stop .ph{width:86px;height:86px;border-radius:16px;overflow:hidden;flex:none;position:relative;background:var(--blush)}
.stop .ph img{width:100%;height:100%;object-fit:cover}
.stop .num{position:absolute;top:6px;left:6px;width:28px;height:28px;border-radius:50%;background:#fff;color:var(--rose);font-family:Fredoka;font-weight:700;display:grid;place-items:center;font-size:16px}
.stop h3{font-size:22px}
.stop .t{font-size:14px;color:var(--muted);font-weight:700}
.stop .state{margin-left:auto;font-size:26px;padding-right:6px}
.stop.locked{opacity:.5;pointer-events:none;filter:grayscale(.6)}
.stop.current{border-color:var(--rose);box-shadow:0 5px 0 var(--rose-d)}
.stop.current .state{animation:pop 1s infinite alternate}
.stop.done{background:var(--ok-bg);border-color:#BFE6D2;box-shadow:0 5px 0 #BFE6D2}

/* game shell */
.ghead{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.ghead .ph{width:62px;height:62px;border-radius:14px;overflow:hidden;flex:none}
.ghead .ph img{width:100%;height:100%;object-fit:cover}
.ghead h2{font-size:26px;line-height:1.1}
.prog{display:flex;gap:6px;margin:6px 0 16px}
.prog i{flex:1;height:9px;border-radius:9px;background:var(--line)}
.prog i.on{background:var(--rose)}
.prog i.ok{background:var(--ok)}
.prog i.no{background:var(--bad)}
.q{font-family:Fredoka;font-weight:600;font-size:clamp(23px,4.6vw,30px);line-height:1.25;margin:4px 0 6px}
.qzh{font-size:16px;color:var(--muted);font-weight:700;min-height:22px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opt{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 12px;font-family:Fredoka;font-weight:600;font-size:clamp(19px,3.8vw,24px);box-shadow:0 5px 0 var(--line);min-height:72px;transition:transform .08s}
.opt:active{transform:translateY(3px)}
.opt.right{background:var(--ok-bg);border-color:var(--ok);box-shadow:0 5px 0 var(--ok);color:#16613F}
.opt.wrong{background:var(--bad-bg);border-color:var(--bad);box-shadow:0 5px 0 var(--bad);color:#8F2219}
.opt.dim{opacity:.45}
.feedback{margin-top:16px;border-radius:16px;padding:14px 16px;font-weight:700;display:flex;gap:12px;align-items:center}
.feedback.ok{background:var(--ok-bg);color:#16613F}
.feedback.bad{background:var(--bad-bg);color:#8F2219}
.feedback .e{font-size:30px}
.next-row{display:flex;justify-content:flex-end;margin-top:16px}
.blank{display:inline-block;min-width:90px;border-bottom:4px solid var(--pink);color:var(--rose);text-align:center;padding:0 6px}

/* match */
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.col{display:flex;flex-direction:column;gap:10px}
.mc{background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px;min-height:58px;font-weight:800;font-size:clamp(17px,3.5vw,21px);box-shadow:0 4px 0 var(--line);transition:all .15s}
.mc.en{font-family:Fredoka;font-weight:600}
.mc.sel{border-color:var(--sky);box-shadow:0 4px 0 var(--sky);background:#EAF2FD}
.mc.gone{background:var(--ok-bg);border-color:#BFE6D2;box-shadow:none;color:#16613F;opacity:.6;pointer-events:none}
.mc.wrong{animation:shake .4s;border-color:var(--bad)}

/* listen */
.speaker{width:130px;height:130px;border-radius:50%;background:var(--rose);color:#fff;font-size:56px;display:grid;place-items:center;margin:8px auto 4px;box-shadow:0 7px 0 var(--rose-d)}
.speaker:active{transform:translateY(5px);box-shadow:0 2px 0 var(--rose-d)}
.speaker.playing{animation:pop .5s}
.slow{display:block;margin:12px auto 0;font-weight:800;color:var(--rose);font-size:15px;background:#fff;border:2px solid var(--line);border-radius:999px;padding:6px 14px}

/* tf */
.tf-img{width:100%;height:210px;border-radius:18px;overflow:hidden;margin-bottom:14px}
.tf-img img{width:100%;height:100%;object-fit:cover}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.tf .opt{font-size:24px;min-height:84px}

/* builder */
.slot{min-height:80px;border:3px dashed var(--line);border-radius:18px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;background:#fff;margin-top:14px}
.slot.okk{border-style:solid;border-color:var(--ok);background:var(--ok-bg)}
.slot.badd{border-color:var(--bad);animation:shake .4s}
.bank{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;justify-content:center}
.tile{font-family:Fredoka;font-weight:600;font-size:clamp(19px,3.8vw,23px);background:#fff;border:2px solid var(--line);border-radius:14px;padding:9px 15px;box-shadow:0 4px 0 var(--line)}
.slot .tile{background:var(--blush);border-color:var(--pink);box-shadow:0 3px 0 var(--pink)}
.tile.used{visibility:hidden}

/* scam */
.overlay{position:fixed;inset:0;background:rgba(30,35,64,.55);display:grid;place-items:center;padding:16px;z-index:20;animation:fi .25s both}
.scam{max-width:520px;width:100%;background:#fff;border-radius:26px;padding:22px;border:3px solid var(--gold);box-shadow:0 8px 0 #C88C1E}
.scam .alert{display:inline-block;background:var(--gold);color:#4a3200;font-family:Fredoka;font-weight:700;border-radius:999px;padding:5px 14px;font-size:15px}
.bubble{margin-top:14px;display:flex;gap:12px;align-items:flex-start}
.bubble .who{font-size:46px;line-height:1}
.bubble .msg{background:var(--cream);border-radius:4px 18px 18px 18px;padding:12px 16px;font-weight:700;font-size:19px}
.bubble .msg .zh{display:block;font-size:15px;color:var(--muted);margin-top:4px}

/* end */
.cert{text-align:center;background:#fff;border:3px solid var(--pink);border-radius:28px;padding:28px 20px;box-shadow:0 8px 0 var(--pink);position:relative;overflow:hidden}
.cert .score{font-family:Fredoka;font-weight:700;font-size:76px;color:var(--rose);line-height:1;margin:10px 0 0}
.cert h1{font-size:34px}
.badge{display:inline-block;margin-top:10px;background:var(--blush);color:var(--rose-d);font-family:Fredoka;font-weight:700;padding:8px 18px;border-radius:999px;font-size:21px}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.stats div{background:var(--cream);border-radius:14px;padding:8px 14px;font-weight:800;font-size:15px}

/* petals */
#petals{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.petal{position:absolute;top:-30px;font-size:24px;opacity:.8;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.plus{position:fixed;z-index:31;font-family:Fredoka;font-weight:700;color:var(--rose);font-size:28px;pointer-events:none;animation:up 0.9s ease-out forwards}
@keyframes up{to{transform:translateY(-60px);opacity:0}}

@media (max-width:480px){
  .opts{grid-template-columns:1fr}
  .stop .ph{width:70px;height:70px}
  .stop h3{font-size:19px}
  .tf-img{height:170px}
}
</style>
</head>

      const o=actx.createOscillator(), g=actx.createGain();
      o.type=type; o.frequency.value=f; o.connect(g); g.connect(actx.destination);
      const st=t+i*dur; g.gain.setValueAtTime(0,st); g.gain.linearRampToValueAtTime(vol,st+0.01); g.gain.exponentialRampToValueAtTime(0.001,st+dur*1.6);
      o.start(st); o.stop(st+dur*1.7);
    });
  }catch(e){}
}
const sfx = {
  ok:()=>tone([660,880],0.09,"triangle"),
  bad:()=>tone([220,180],0.14,"square",0.08),
  win:()=>tone([523,659,784,1047],0.12,"triangle"),
  alert:()=>tone([880,660,880],0.1,"square",0.06)
};

let voice=null;
function pickVoice(){
  try{
    const vs = speechSynthesis.getVoices();
    voice = vs.find(v=>/en[-_]GB/i.test(v.lang)) || vs.find(v=>/en[-_]US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
  }catch(e){}
}
const canSpeak = (()=>{try{return "speechSynthesis" in window && typeof SpeechSynthesisUtterance!=="undefined";}catch(e){return false;}})();
if(canSpeak){ pickVoice(); try{speechSynthesis.onvoiceschanged=pickVoice;}catch(e){} }
function speak(text, rate=0.85){
  if(!canSpeak) return false;
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.lang="en-GB"; u.rate=rate; if(voice) u.voice=voice;
    speechSynthesis.speak(u); return true;
  }catch(e){return false;}
}

/* ---------------- 1. word match ---------------- */
function gMatch(st, done){
  const rounds=[shuffle(VOCAB_TOKYO).slice(0,6), null];
  // round 2: other 6 Tokyo words
  rounds[1]=VOCAB_TOKYO.filter(w=>!rounds[0].includes(w));
  let r=0; const results=[];
  const play=()=>{
    const set=rounds[r]; const left=shuffle(set), right=shuffle(set);
    let sel=null, matched=0, misses=0;
    const el=mount(shell(st,2,r,results,`
      <div class="q" style="font-size:24px">Match the English with the Chinese.</div>
      <div class="qzh zh">把英文和中文配對。Round ${r+1} / 2</div>
      <div class="match">
        <div class="col">${left.map(w=>`<button class="mc en" data-k="${esc(w[0])}">${esc(w[0])}</button>`).join("")}</div>
        <div class="col">${right.map(w=>`<button class="mc zh" data-k="${esc(w[0])}">${w[1]}</button>`).join("")}</div>
      </div><div id="fb"></div>`));
    const ens=[...el.querySelectorAll(".mc.en")], zhs=[...el.querySelectorAll(".mc.zh")];
    ens.forEach(b=>b.onclick=()=>{ ens.forEach(x=>x.classList.remove("sel")); sel=b; b.classList.add("sel"); speak(b.dataset.k); });
    zhs.forEach(b=>b.onclick=()=>{
      if(!sel){ ens.forEach(x=>{if(!x.classList.contains("gone")){x.classList.add("wrong");setTimeout(()=>x.classList.remove("wrong"),400);}}); return; }
      if(b.dataset.k===sel.dataset.k){
        sel.classList.remove("sel"); sel.classList.add("gone"); b.classList.add("gone");
        S.total++; S.right++; addPetal(b,1); sfx.ok(); sel=null; matched++;
        if(matched===set.length){
          results[r]= misses<=1;
          el.querySelector("#fb").innerHTML=feedbackHTML(true, misses===0?"Perfect! No mistakes! 🌟":`All matched! (${misses} mistake${misses>1?"s":""})`, "全部配對成功！")+
            `<div class="next-row"><button class="btn" id="nx">${r===0?"Round 2 →":"Done ✓"}</button></div>`;
          el.querySelector("#nx").onclick=()=>{ r++; r<2?play():done(); };
        }
      } else { misses++; sfx.bad(); b.classList.add("wrong"); sel.classList.add("wrong"); const s=sel; setTimeout(()=>{b.classList.remove("wrong");s.classList.remove("wrong");},420); }
    });
  };
  play();
}

/* ---------------- 5. sentence builder ---------------- */
function gBuild(st, done){
  const N=4; const qs=shuffle(BUILD).slice(0,N); const results=[]; let i=0;
  const ask=()=>{
    const q=qs[i]; const words=q.s.split(" ");
    let order; do{ order=shuffle(words.map((w,k)=>k)); }while(words.length>2 && order.every((v,k)=>v===k));
    const placed=[]; let tries=0;
    const el=mount(shell(st,N,i,results,`
      <div class="q" style="font-size:24px">Put the words in order.</div>
      <div class="qzh zh">把詞語排成正確的句子：「${q.zh}」</div>
      <div class="slot" id="slot"><span class="muted" id="ph" style="padding:8px;font-weight:700">Tap the words below 點擊下面的詞 👇</span></div>
      <div class="bank" id="bank">${order.map(k=>`<button class="tile" data-k="${k}">${esc(words[k])}</button>`).join("")}</div>
      <div style="display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap">
        <button class="btn ghost" id="undo">↩︎ Undo</button>
        <button class="btn" id="chk" disabled>Check ✓</button>
      </div><div id="fb"></div>`));
    const slot=el.querySelector("#slot"), chk=el.querySelector("#chk");
    const redraw=()=>{
      slot.querySelectorAll(".tile").forEach(t=>t.remove());
      el.querySelector("#ph").style.display=placed.length?"none":"";
      placed.forEach((k,pos)=>{ const t=$(`<button class="tile">${esc(words[k])}</button>`); t.onclick=()=>{ if(locked) return; placed.splice(pos,1); el.querySelector(`#bank .tile[data-k="${k}"]`).classList.remove("used"); redraw(); }; slot.appendChild(t); });
      chk.disabled = placed.length!==words.length;
    };
    let locked=false;
    el.querySelectorAll("#bank .tile").forEach(t=>t.onclick=()=>{ if(locked) return; placed.push(+t.dataset.k); t.classList.add("used"); redraw(); });
    el.querySelector("#undo").onclick=()=>{ if(locked||!placed.length) return; const k=placed.pop(); el.querySelector(`#bank .tile[data-k="${k}"]`).classList.remove("used"); redraw(); };
    chk.onclick=()=>{
      // compare text so duplicate words in any order still count
      const built=placed.map(k=>words[k]).join(" ");
      const ok = built===q.s;
      if(ok){
        locked=true; results[i]= tries===0; slot.classList.add("okk");
        if(tries===0){S.total++; S.right++;} addPetal(chk, tries===0?2:1); sfx.ok(); speak(q.s);
        el.querySelector("#fb").innerHTML=feedbackHTML(true, tries===0?"Perfect sentence! +2 🌸":"You got it! +1 🌸", q.zh)+
          `<div class="next-row"><button class="btn" id="nx">${i+1<N?"Next →":"Done ✓"}</button></div>`;
        el.querySelector("#undo").disabled=true; chk.disabled=true;
        el.querySelector("#nx").onclick=()=>{ i++; i<N?ask():done(); };
      } else {
        tries++; sfx.bad(); slot.classList.remove("badd"); void slot.offsetWidth; slot.classList.add("badd");
        if(tries===1){ S.total++; }
        // show first wrong position as a hint
        let firstBad=placed.findIndex((k,p)=>words[k]!==words[p]);
        el.querySelector("#fb").innerHTML=feedbackHTML(false, "Not yet — try again!", `第 ${firstBad+1} 個詞不對，再試一次！ Hint: the sentence starts with “${words[0]}”.`);
      }
    };
  };
  ask();
}

/* ---------------- end ---------------- */
function showEnd(){
  const mins=Math.max(1,Math.round((Date.now()-S.start)/60000));
  const pct = S.total? Math.round(S.right/S.total*100):0;
  const badge = S.petals>=42?"🌟 Brightest Star 最亮的星":S.petals>=34?"🌸 Sakura Master 櫻花大師":S.petals>=24?"🗼 Tokyo Explorer 東京探險家":"✈️ Brave Traveller 勇敢旅人";
  petalBurst(22); setTimeout(()=>petalBurst(14),1400); sfx.win();
  const el=mount(`${topBar(false)}
    <div class="cert">
      <div class="eyebrow">Japan Quest · Complete! 冒險完成</div>
      <h1 style="margin-top:8px">Well done, ${esc(S.name)}!</h1>
      <div class="score">${S.petals} 🌸</div>
      <div class="muted" style="font-weight:800">sakura petals collected 收集到的櫻花</div>
      <div class="badge">${badge}</div>
      <div class="stats">
        <div>✅ ${pct}% correct 答對率</div>
        <div>🛡️ ${S.scamsDodged} scam${S.scamsDodged===1?"":"s"} stopped 識破騙局</div>
        <div>⏱️ ${mins} min</div>
      </div>
      <p class="f" style="font-size:24px;margin:20px 0 4px;color:var(--rose)">Shine like the brightest star! ✨</p>
      <p class="zh muted" style="margin:0;font-weight:700">像最亮的星星一樣發光！</p>
      <p style="font-weight:800;margin-top:16px">📸 Show this screen to your teacher! <span class="zh">給老師看看！</span></p>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px">
        <button class="btn ghost" id="again">🔁 Play again 再玩一次</button>
      </div>
    </div>`);
  speak("Well done, "+S.name+"! Shine like the brightest star!");
  el.querySelector("#again").onclick=showStart;
}

showStart();
</script>
</body>
</html>
